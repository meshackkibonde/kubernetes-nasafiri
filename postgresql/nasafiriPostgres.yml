#pvc for the postgres
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage:  10Gi
  storageClassName: standard
---
##postgres
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: "postgres"
  replicas: 1
  selector:
    matchLabels:
      app:  postgres
  template:
    metadata:
      labels:
        app:  postgres
    spec:
      containers:
        - name: postgres
          image:  postgres:16-alpine  
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_PASSWORD
              value: "admin"
            - name: POSTGRES_DB
              value: "db"
            - name: POSTGRES_USER
              value: "admin"
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: postgres-data
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-pvc
---
#service for postgres
apiVersion: v1
kind: Service
metadata:
  name: db-service
spec:
  clusterIP: None
  ports:
    - port: 5432
      name: postgres
  selector:
    app:  postgres
