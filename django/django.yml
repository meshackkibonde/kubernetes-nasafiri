#django deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nasafiri-backend-python
spec:
  replicas: 1
  selector:
    matchLabels:
      app:  nasafiri-backend-python
  template:
    metadata:
      labels:
        app:  nasafiri-backend-python
    spec:
      containers:
        - name: nasafiri-backend-python
          image: meshackkibonde/nasafiri-backend-python:v1 
          imagePullPolicy: Always
          command:  ["/bin/sh", "-c"]
          args:
            - |
              python manage.py migrate && \
              python manage.py load_routes && \
              python manage.py collectstatic --noinput && \
              exec gunicorn --config gunicorn_config.py backend.wsgi:application  
          resources:
            requests:
              memory: "256Mi"
              cpu:  "100m"
            limits:
              memory: "512Mi"
              cpu:  "1000m"
          env:
            - name: DB_HOST
              value: "db-service"
            - name: DB_PORT
              value: "5432"
            - name: USE_LOCAL_DB
              value: "false"
            - name: REDIS_HOST
              value: "redis-service"   
            - name: REDIS_PORT
              value: "6379"    
          envFrom:
            - configMapRef:
                name: django-config-map-ref
            - secretRef:
                name: django-secret-ref
          volumeMounts:
            - mountPath: /app/static
              name: static-volume
            - mountPath: /app/media
              name: media-volume
          ports:
            - containerPort: 8000
      volumes:
        - name: static-volume
          persistentVolumeClaim:
            claimName: static-volume-claim
        - name: media-volume
          persistentVolumeClaim:
            claimName: media-volume-claim
---

#postgres service
apiVersion: v1
kind: Service
metadata:
  name: django-service
spec:
  type: ClusterIP
  selector:
    app:  nasafiri-backend-python
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
  