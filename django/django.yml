apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: static-volume-claim
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage:  10Gi
  storageClassName: standard
---

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media-volume-claim
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage:  10Gi
  storageClassName: standard
---

